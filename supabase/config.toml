[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[studio]
enabled = true
port = 54323

# Serviços desligados localmente: o DevReview não usa e-mail, Storage, Realtime,
# Edge Functions nem Analytics. Economiza memória na VM do Colima e evita o
# container `vector` (que monta o docker.sock). Só afeta o stack local.
[local_smtp]
enabled = false
port = 54324

[storage]
enabled = false

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["https://localhost:5173"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true

[realtime]
enabled = false

[edge_runtime]
enabled = false

[analytics]
enabled = false
